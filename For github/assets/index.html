<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/For github/assets/css/style.css">
    <script src="/For github/main.js"></script>
    <script src="counter.js"></script>
</head>

<body>
    <section>
        <h1>guest</h1>
        <button onclick="sayHello()">click</button>
    </section>

    <section>
        <p id="counter">0</p>
        <button onclick="increment()">+1</button>
        <button onclick="decrement()">-1</button>
        <button onclick="reset()">Reset</button>
    </section>

    <!-- image selection -->
    <section>
        <img id="photo" src="assets/images/cat.jpg" width="320">
        <button onclick="changePic()">change</button>
    </section>

    <!-- time selection -->
    <section>
        <p id="clock">:------:</p>
    </section>
    <!-- event listener section -->
    <section>
        <button id="btn">クリック</button>
        <p id="result"></p>
    </section>


    <script src="assets/js/main.js"></script>
    <script src="assets/js/counter.js"></script>
    <script src="assets/js/image.js"></script>
    <script src="assets/js/timer.js"></script>
    <script src="assets/js/eventListener.js"></script>
</body>

</html>
